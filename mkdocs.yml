site_name: runway
site_description: Deploy applications to Google Cloud Run from a single runway.yaml
site_url: https://runway.echaouchna.dev/docs/
repo_url: https://github.com/echaouchna/runway
repo_name: runway
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  slides/
  requirements.txt

theme:
  name: material
  logo: assets/runway-logo-dark.svg
  favicon: assets/runway-icon.svg
  # The homepage's system font stacks (docs/assets/stylesheets/runway.css):
  # nothing is loaded from Google Fonts.
  font: false
  # Dark first, like runway.echaouchna.dev; colors in runway.css.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/runway.css

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Commands: commands.md
  - Guides:
      - Services, jobs and schedules: services-and-jobs.md
      - Previews, canaries and traffic: traffic.md
      - Releases: releases.md
      - Custom domains: domains.md
      - Secrets: secrets.md
      - CI/CD: ci-cd.md
      - Permissions: permissions.md
      - Undeploying: undeploy.md
  - Reference:
      - How it works: how-it-works.md
      - Architecture: architecture.md
      - Roadmap: roadmap.md
      - Limitations and status: limitations.md
      - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.details

validation:
  links:
    anchors: warn

extra:
  homepage: https://runway.echaouchna.dev/
