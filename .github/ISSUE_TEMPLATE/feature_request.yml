name: Feature request
description: Suggest a new capability or an improvement.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the **problem** first: we may solve it differently from your first idea.
        Check the [roadmap](https://github.com/echaouchna/runway/blob/main/docs/roadmap.md) and existing issues.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would it look in `runway.yaml` or on the command line?
      render: yaml
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What do you use today (gcloud, Terraform, scripts)?
  - type: dropdown
    id: contribute
    attributes:
      label: Would you contribute it?
      options:
        - "No"
        - Yes, with guidance
        - Yes, I can open a PR
