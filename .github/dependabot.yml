# Monthly, grouped updates: one pull request per ecosystem and month instead
# of one per dependency (each pull request runs CI).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /docs
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      docs:
        patterns: ["*"]
