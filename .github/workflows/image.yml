# Container image on GitHub Container Registry (ghcr.io/echaouchna/runway),
# for linux/amd64 and linux/arm64.
#
#   tag v1.2.3      -> :1.2.3, :1.2, :latest   (pre-releases: only :1.2.3-rc1)
#   manual run      -> :edge (main) or the branch name
#   main branch     -> :edge, :sha-<short>, only if the repository variable
#                      PUBLISH_EDGE is "true" (each push adds an image version,
#                      which counts against the Packages storage of a private
#                      repository)
#
# One job on one amd64 runner builds both platforms: the Dockerfile's build
# stage runs natively and cross-compiles for arm64; only the final stage's
# package install (git, curl, CA certificates) runs under QEMU emulation for
# arm64, a minute or two. RUNNER_LINUX overrides the GitHub-hosted runner.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  image:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || vars.PUBLISH_EDGE == 'true'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name (lowercase)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=runway
            org.opencontainers.image.description=Deploy applications to Google Cloud Run from a single runway.yaml
            org.opencontainers.image.licenses=Apache-2.0
      # The final stage installs packages on arm64 (emulated).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
      # Build provenance. Artifact attestations need a public repository
      # (or GitHub Enterprise Cloud for private ones), hence the condition.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
