# Release binaries, called by release.yml (tags) and edge.yml (main): archives
# runway-v<version>-<target>.tar.gz with a .sha256 each, uploaded as the
# artifacts dist-<name>.
#
# Always: Linux x86_64 (glibc 2.35+). Also, when the repository is public or
# the variable is "true":
#   - Linux aarch64 (BUILD_ARM64): free arm64 runners are for public repositories;
#   - macOS arm64 + x86_64 (BUILD_MACOS): macOS minutes count 10x in private
#     repositories, so both targets are built in one job.
name: build

on:
  workflow_call:
    inputs:
      version:
        description: Version in the archive names (1.2.3, 1.2.3-edge.42)
        required: true
        type: string
      display-version:
        description: "`runway --version` output, when it differs from Cargo.toml"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(format('[{0}{1}{2}]',
          format('{{"name":"linux-x86_64","runner":"{0}","targets":"x86_64-unknown-linux-gnu"}}', vars.RUNNER_LINUX_2204 || 'ubuntu-22.04'),
          (!github.event.repository.private || vars.BUILD_ARM64 == 'true') && format(',{{"name":"linux-aarch64","runner":"{0}","targets":"aarch64-unknown-linux-gnu"}}', vars.RUNNER_LINUX_ARM_2204 || 'ubuntu-22.04-arm') || '',
          (!github.event.repository.private || vars.BUILD_MACOS == 'true') && ',{"name":"macos","runner":"macos-15","targets":"aarch64-apple-darwin x86_64-apple-darwin"}' || '')) }}
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - name: Install lld (aarch64 Linux linker, see .cargo/config.toml)
        if: contains(matrix.targets, 'aarch64-unknown-linux-gnu')
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Build and package
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
          VERSION: ${{ inputs.version }}
          DISPLAY_VERSION: ${{ inputs.display-version }}
        run: |
          if [ -n "$DISPLAY_VERSION" ]; then export RUNWAY_VERSION="$DISPLAY_VERSION"; fi
          for target in $TARGETS; do
            cargo build --profile dist --locked --target "$target"
            name="runway-v${VERSION}-${target}"
            mkdir "$name"
            cp "target/${target}/dist/runway" LICENSE README.md CHANGELOG.md "$name/"
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.name }}
          path: runway-*.tar.gz*
          retention-days: 1
