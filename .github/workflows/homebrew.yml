# Homebrew formula from the archives built in the calling run (dist-*
# artifacts), pushed to the tap named by the variable HOMEBREW_TAP (for example
# echaouchna/homebrew-tap) with the secret HOMEBREW_TAP_TOKEN (fine-grained
# token: Contents read and write on that repository only).
#
#   stable  Formula/runway.rb       (release.yml, stable tags)
#   edge    Formula/runway-edge.rb  (edge.yml, main)
#
# Both install `runway`; installing one over the other stops at `brew link`
# with Homebrew's unlink instructions. No `conflicts_with`: Homebrew refuses to
# load the other formula from a tap the user has not trusted, which would
# break every install.
name: homebrew

on:
  workflow_call:
    inputs:
      channel:
        description: stable or edge
        required: true
        type: string
      version:
        description: Version in the archive names (1.2.3, 1.2.3-edge.42)
        required: true
        type: string
      tag:
        description: Release tag the archives are attached to (v1.2.3, edge)
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  formula:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Formula from the checksums of the built targets
        env:
          REPO: ${{ github.repository }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$CHANNEL" in
            stable) formula=runway class=Runway desc="Deploy applications to Google Cloud Run from a single runway.yaml" ;;
            edge) formula=runway-edge class=RunwayEdge desc="Deploy applications to Google Cloud Run (development build of main)" ;;
            *) echo "::error::unknown channel $CHANNEL"; exit 1 ;;
          esac
          url="https://github.com/${REPO}/releases/download/${TAG}/runway-v${VERSION}"
          sha() { awk -v f="runway-v${VERSION}-$1.tar.gz" '$2 == f {print $1}' dist/*.sha256; }
          cpu() { # on_arm / on_intel, if the target was built
            local s
            s=$(sha "$2")
            [ -z "$s" ] || printf '    %s do\n      url "%s-%s.tar.gz"\n      sha256 "%s"\n    end\n' "$1" "$url" "$2" "$s"
          }
          os() { # on_macos / on_linux with the CPUs that were built
            [ -n "$(sha "$2")$(sha "$3")" ] || return 0
            printf '\n  on_%s do\n' "$1"
            cpu on_arm "$2"
            cpu on_intel "$3"
            printf '  end\n'
          }
          {
            printf '# Generated by the release workflows of https://github.com/%s. Do not edit.\n' "$REPO"
            printf 'class %s < Formula\n' "$class"
            printf '  desc "%s"\n' "$desc"
            printf '  homepage "https://runway.echaouchna.dev/"\n'
            # Edge archive names hide the version from Homebrew's URL parser.
            [ "$CHANNEL" = stable ] || printf '  version "%s"\n' "$VERSION"
            printf '  license "Apache-2.0"\n'
            if [ "$CHANNEL" = stable ]; then
              printf '\n  livecheck do\n    url :stable\n    strategy :github_latest\n  end\n'
            else
              printf '\n  livecheck do\n    skip "Rebuilt on every push to main"\n  end\n'
            fi
            os macos aarch64-apple-darwin x86_64-apple-darwin
            os linux aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
            printf '\n  def install\n'
            printf '    bin.install "runway"\n'
            printf '    generate_completions_from_executable(bin/"runway", "completions")\n'
            printf '  end\n'
            printf '\n  test do\n'
            printf '    assert_match version.to_s, shell_output("#{bin}/runway --version")\n'
            printf '  end\n'
            printf 'end\n'
          } > "$formula.rb"
          cat "$formula.rb"
          echo "FORMULA=$formula" >> "$GITHUB_ENV"
      # Credentials are kept for the push below (to the tap only).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.HOMEBREW_TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p tap/Formula
          cp "$FORMULA.rb" "tap/Formula/$FORMULA.rb"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/$FORMULA.rb"
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git commit -m "$FORMULA $VERSION"
          git push
