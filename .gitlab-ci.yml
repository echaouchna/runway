# Formatting, lints and tests. The live GCP test is opt-in and never runs here
# (see tests/live_gcp.rs and README.md#testing).
stages:
  - check
  - image

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always

.rust:
  image: rust:1
  stage: check
  cache:
    key:
      files: [Cargo.lock]
    paths: [.cargo/registry/index, .cargo/registry/cache, target/]
  before_script:
    - rustup component add rustfmt clippy
    - rustc --version && cargo --version

fmt:
  extends: .rust
  cache: []
  script:
    - cargo fmt --all -- --check

clippy:
  extends: .rust
  script:
    - cargo clippy --locked --all-targets -- -D warnings

test:
  extends: .rust
  script:
    - cargo test --locked

# Container image with the runway CLI, for use as `image:` in deployment jobs.
# Pushed as $CI_REGISTRY_IMAGE:<sha> on every default-branch commit, plus
# :latest, and :<tag> for git tags.
image:
  stage: image
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_BUILDKIT: "1"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      else
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
